name: Daily social posts

# Namibia time is UTC+2, so 07:00 UTC = 09:00 and 16:00 UTC = 18:00 in Namibia.
# GitHub can start scheduled runs a few minutes late - that is normal.
on:
  schedule:
    - cron: '0 7 * * *'
    - cron: '0 16 * * *'
  workflow_dispatch:
    inputs:
      post_id:
        description: 'Optional: post a specific post id from social/posts.json'
        required: false
      dry_run:
        description: 'Dry run (show what would be posted, post nothing)'
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: social-post
  cancel-in-progress: false

jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Post to Facebook and Instagram
        env:
          FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
          FB_PAGE_TOKEN: ${{ secrets.FB_PAGE_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          POST_ID: ${{ github.event.inputs.post_id }}
          DRY_RUN: ${{ github.event.inputs.dry_run }}
        run: python social/post.py

      # GitHub switches off scheduled runs in repos with no activity for 60 days.
      # One tiny commit every Monday keeps the robot running.
      - name: Keep schedule alive
        if: github.event_name == 'schedule'
        run: |
          if [ "$(date -u +%u)" = "1" ] && [ "$(date -u +%H)" -lt 12 ]; then
            date -u > social/last_run.txt
            git config user.name "ironpeak-robot"
            git config user.email "ironpeak-robot@users.noreply.github.com"
            git add social/last_run.txt
            git commit -m "Robot keep-alive" && git push || true
          fi
